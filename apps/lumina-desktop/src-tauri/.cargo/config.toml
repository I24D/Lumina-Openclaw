# Incremental compilation — recompiles only changed crates.
# Reduces Tauri Rust build time by 40–70% on repeated runs.
# Enabled for dev and release; CI sets CARGO_INCREMENTAL=1 via env.

[build]
incremental = true

[profile.dev]
incremental = true

[profile.release]
incremental = true
# opt-level 2 instead of 3: marginally slower binary, but 30–40% faster link time.
# Switch back to 3 if runtime performance matters more than CI speed.
opt-level = 2

# Split debug info into separate files so the linker only re-links what changed.
[profile.release.build-override]
incremental = true

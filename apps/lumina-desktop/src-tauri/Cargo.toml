[package]
name = "lumina-desktop-tauri"
version = "1.0.1"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.5.6" }

[dependencies]
anyhow = "1"
http = "1"
mime_guess = "2"
open = "5"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.10.3" }
url = "2"

name: Lumina Baseline CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Typecheck baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check conflict markers
        run: pnpm check:no-conflict-markers

      - name: Typecheck core
        run: pnpm tsgo:core

      - name: Typecheck extensions
        run: pnpm tsgo:extensions

name: lumina-windows-candidate

on:
  push:
    branches:
      - "release/lumina-desktop-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Expected Lumina Desktop version"
        required: true
        default: "1.0.14"
        type: string
      require_signing:
        description: "Require Authenticode signing (mandatory for final release)"
        required: true
        default: true
        type: boolean
      smoke_seconds:
        description: "Installed runtime smoke-test duration"
        required: true
        default: "120"
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: "24.13.1"
  PNPM_VERSION: "10.33.0"
  LUMINA_AUTH_URL: "https://lumina-auth.onrender.com"
  LUMINA_I24D_BASE_URL: "https://i24d-whatsapp-ai.onrender.com"
  LUMINA_I24D_CHAT_URL: "https://i24d-whatsapp-ai.onrender.com/v1/chat/completions"
  LUMINA_PROVIDER_ID: "lumina"
  LUMINA_MODEL_ID: "I24D"
  LUMINA_MODEL_NAME: "Lumina IA"
  LUMINA_MODEL_CONTEXT_WINDOW: "16000"
  LUMINA_MODEL_MAX_TOKENS: "4096"
  LUMINA_DEFAULT_TAB: "instances"
  LUMINA_REQUIRE_AUTH: "false"
  LUMINA_EMBED_RUNTIME_SECRETS: "false"
  LUMINA_REMOTE_BRAIN_ENABLED: "false"
  LUMINA_SKIP_OPENCLAW_BUILD: "1"
  LUMINA_SKIP_OPENCLAW_UI_BUILD: "1"
  LUMINA_TAURI_EMBED_RESOURCES: "1"
  CARGO_INCREMENTAL: "1"
  CARGO_TERM_COLOR: "always"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust/lumina-bootstrapper -> target
            rust/lumina-voice -> target
            apps/lumina-desktop/src-tauri -> target
          shared-key: "lumina-rust-windows"
          cache-on-failure: false

      - name: Validate frozen version
        shell: pwsh
        run: |
          $expected = "${{ inputs.version || '1.0.14' }}"
          $files = @(
            "package.json",
            "apps/lumina-desktop/package.json",
            "apps/lumina-desktop/src-tauri/tauri.conf.json"
          )
          foreach ($file in $files) {
            $actual = (Get-Content -LiteralPath $file -Raw | ConvertFrom-Json).version
            if ($actual -ne $expected) {
              throw "$file has version $actual; expected $expected."
            }
          }
          foreach ($file in @(
            "apps/lumina-desktop/src-tauri/Cargo.toml",
            "rust/lumina-bootstrapper/Cargo.toml",
            "rust/lumina-voice/Cargo.toml"
          )) {
            $raw = Get-Content -LiteralPath $file -Raw
            if ($raw -notmatch "(?m)^version\s*=\s*`"$([regex]::Escape($expected))`"") {
              throw "$file does not declare version $expected."
            }
          }

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build OpenClaw runtime
        working-directory: Open_PC
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: pnpm build:docker

      - name: Build OpenClaw UI
        working-directory: Open_PC
        run: pnpm ui:build

      - name: Download official Lumina Code VSIX
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.I24D_GITHUB }}
        run: |
          New-Item -ItemType Directory -Path lumina-code-vsix -Force | Out-Null
          gh release download --repo I24D/Lumina-i24d-bot --pattern "lumina-code-*.vsix" --dir lumina-code-vsix
          $vsix = Get-ChildItem -LiteralPath lumina-code-vsix -Filter "*.vsix" |
            Sort-Object Name |
            Select-Object -Last 1
          if (-not $vsix) {
            throw "Lumina Code VSIX was not downloaded."
          }
          "LUMINA_CODE_VSIX_PATH=$($vsix.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Import Authenticode certificate
        if: ${{ inputs.require_signing == true }}
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            throw "Signing was required, but WINDOWS_CERTIFICATE or WINDOWS_CERTIFICATE_PASSWORD is missing."
          }
          $certificateDir = Join-Path $env:RUNNER_TEMP "lumina-certificate"
          New-Item -ItemType Directory -Path $certificateDir -Force | Out-Null
          $pfxPath = Join-Path $certificateDir "lumina-code-signing.pfx"
          [IO.File]::WriteAllBytes(
            $pfxPath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          )
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $cert.HasPrivateKey) {
            throw "Imported certificate has no private key."
          }
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "LUMINA_REQUIRE_WINDOWS_SIGNING=1" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Remove-Item -LiteralPath $pfxPath -Force

      - name: Configure unsigned candidate mode
        if: ${{ inputs.require_signing != true }}
        shell: pwsh
        run: '"LUMINA_REQUIRE_WINDOWS_SIGNING=0" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append'

      - name: Configure signing command path
        shell: pwsh
        run: '"LUMINA_SIGN_SCRIPT=${{ github.workspace }}\scripts\sign-windows-file.ps1" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append'

      - name: Preflight source
        run: node --experimental-strip-types scripts/preflight-check.ts --mode=source

      - name: Prepare and compile desktop
        run: pnpm --filter @lumina/desktop tauri:build

      - name: Build signed NSIS setup
        if: ${{ inputs.require_signing == true }}
        run: pnpm --filter @lumina/desktop tauri:bundle:signed

      - name: Build unsigned NSIS candidate
        if: ${{ inputs.require_signing != true }}
        run: pnpm --filter @lumina/desktop tauri:bundle

      - name: Stage setup.exe
        run: pnpm desktop:setup:win:stage

      - name: Verify Authenticode signatures
        if: ${{ inputs.require_signing == true }}
        shell: pwsh
        run: |
          $setup = Get-ChildItem -LiteralPath apps/lumina-desktop/release -Filter "*setup.exe" |
            Sort-Object LastWriteTime |
            Select-Object -Last 1
          if (-not $setup) {
            throw "Staged setup.exe is missing."
          }
          & scripts/verify-windows-release.ps1 -SetupPath $setup.FullName

      - name: Smoke-test installed application
        shell: pwsh
        run: |
          $setup = Get-ChildItem -LiteralPath apps/lumina-desktop/release -Filter "*setup.exe" |
            Sort-Object LastWriteTime |
            Select-Object -Last 1
          & scripts/test-installed-release.ps1 `
            -SetupPath $setup.FullName `
            -DurationSeconds ([int]"${{ inputs.smoke_seconds || '120' }}")

      - name: Upload Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: lumina-openclaw-${{ inputs.version || '1.0.14' }}-windows-x64-${{ inputs.require_signing == true && 'signed' || 'unsigned' }}
          path: |
            apps/lumina-desktop/release/Lumina.OpenClaw_${{ inputs.version || '1.0.14' }}_x64-setup.exe
            apps/lumina-desktop/release/Lumina.OpenClaw_${{ inputs.version || '1.0.14' }}_x64-setup.exe.sha256
          if-no-files-found: error
          retention-days: 14

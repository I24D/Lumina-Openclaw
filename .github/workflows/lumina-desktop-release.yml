name: lumina-desktop-release

on:
  workflow_dispatch:
    inputs:
      release_only:
        description: "Re-run only the publish-release step. Assets must already be on the draft release."
        type: boolean
        default: false
  push:
    tags:
      - "lumina-desktop-v*"

permissions:
  contents: write

env:
  NODE_VERSION: "24.13.1"
  PNPM_VERSION: "10.33.0"
  LUMINA_AUTH_URL: "https://lumina-auth.onrender.com"
  LUMINA_I24D_BASE_URL: "https://i24d-whatsapp-ai.onrender.com"
  LUMINA_I24D_CHAT_URL: "https://i24d-whatsapp-ai.onrender.com/v1/chat/completions"
  LUMINA_PROVIDER_ID: "lumina"
  LUMINA_MODEL_ID: "I24D"
  LUMINA_MODEL_NAME: "Lumina IA"
  LUMINA_MODEL_CONTEXT_WINDOW: "16000"
  LUMINA_MODEL_MAX_TOKENS: "4096"
  LUMINA_DEFAULT_TAB: "instances"
  LUMINA_REQUIRE_AUTH: "false"
  LUMINA_EMBED_RUNTIME_SECRETS: "false"
  LUMINA_REMOTE_BRAIN_ENABLED: "false"
  LUMINA_SKIP_OPENCLAW_BUILD: "1"
  LUMINA_SKIP_OPENCLAW_UI_BUILD: "1"
  LUMINA_TAURI_EMBED_RESOURCES: "1"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  GZIP: "-1"
  CARGO_INCREMENTAL: "1"
  CARGO_TERM_COLOR: "always"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── 1 of 5 ────────────────────────────────────────────────────────────────────
  # Builds OpenClaw (pure JS/CSS — platform-agnostic).
  # On tag builds: creates a draft GitHub Release and uploads openclaw-build.tar.gz
  # as a release asset (~30-50 MB compressed). Release assets have a 2 GB limit
  # and do NOT count against the 500 MB Actions artifact quota.
  build-openclaw:
    name: "1/5 build-openclaw"
    if: ${{ github.event.inputs.release_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Open_PC dependencies
        working-directory: Open_PC
        run: pnpm install --frozen-lockfile

      - name: "Pre-flight: disk space"
        run: |
          df -h
          AVAIL_KB=$(df --output=avail / | tail -1 | tr -d ' ')
          if [ "$AVAIL_KB" -lt 5242880 ]; then
            echo "::error::Less than 5 GB free."
            exit 1
          fi

      - name: Build OpenClaw runtime
        working-directory: Open_PC
        run: pnpm build:docker

      - name: Build OpenClaw UI
        working-directory: Open_PC
        run: pnpm ui:build

      # Create the draft release first so we can immediately upload openclaw-build.tar.gz to it.
      - name: Create draft GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Lumina Desktop ${{ github.ref_name }}" \
            --draft \
            --notes "Assembling release assets…" || true

      # Pack and upload OpenClaw output as a release asset.
      # Platform jobs download this via gh release download — no artifact quota used.
      - name: Upload OpenClaw build to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tar -czf openclaw-build.tar.gz \
            Open_PC/dist \
            Open_PC/openclaw.mjs \
            Open_PC/assets \
            Open_PC/skills \
            Open_PC/pnpm-lock.yaml
          gh release upload "${{ github.ref_name }}" openclaw-build.tar.gz --clobber

  fetch-lumina-code:
    name: "1b/5 fetch-lumina-code"
    if: ${{ github.event.inputs.release_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download official Lumina Code VSIX
        env:
          GH_TOKEN: ${{ secrets.I24D_GITHUB }}
        run: |
          mkdir -p lumina-code-vsix
          gh release download --repo I24D/Lumina-i24d-bot --pattern "lumina-code-*.vsix" --dir lumina-code-vsix
          test -n "$(find lumina-code-vsix -maxdepth 1 -name 'lumina-code-*.vsix' -print -quit)"

      - name: Upload Lumina Code VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumina-code-vsix
          path: lumina-code-vsix/lumina-code-*.vsix
          if-no-files-found: error
          retention-days: 1

  # ── 2 of 5 ────────────────────────────────────────────────────────────────────
  build-windows:
    name: "2/5 build-windows"
    if: ${{ github.event.inputs.release_only != 'true' }}
    needs: [build-openclaw, fetch-lumina-code]
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust/lumina-bootstrapper -> target
            apps/lumina-desktop/src-tauri -> target
          shared-key: "lumina-rust-windows"
          cache-on-failure: false
          save-if: "false"

      - name: Download Lumina Code VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: lumina-code-vsix
          path: lumina-code-vsix

      - name: Export Lumina Code VSIX path
        shell: pwsh
        run: |
          $vsix = Get-ChildItem -LiteralPath lumina-code-vsix -Filter '*.vsix' | Sort-Object Name | Select-Object -Last 1
          if (-not $vsix) { throw 'Lumina Code VSIX artifact is missing.' }
          "LUMINA_CODE_VSIX_PATH=$($vsix.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: "Pre-flight: source layout"
        run: node --experimental-strip-types scripts/preflight-check.ts --mode=source

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # Download openclaw-build.tar.gz from the release (no artifact quota).
      # Falls back to building locally if the release asset is unavailable.
      - name: Download OpenClaw from release
        id: dl-openclaw-win
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release download "${{ github.ref_name }}" \
            --pattern "openclaw-build.tar.gz"
          tar -xzf openclaw-build.tar.gz
          rm openclaw-build.tar.gz

      - name: Build OpenClaw locally (fallback)
        if: steps.dl-openclaw-win.outcome == 'failure' || steps.dl-openclaw-win.outcome == 'skipped'
        shell: bash
        run: |
          cd Open_PC
          pnpm install --frozen-lockfile
          pnpm build:docker
          pnpm ui:build

      - name: "Pre-flight: bundle inputs"
        run: node --experimental-strip-types scripts/preflight-check.ts --mode=bundle-inputs

      - name: Build Rust bootstrapper
        run: pnpm desktop:bootstrapper:build

      - name: Build desktop (Windows)
        env:
          LUMINA_GITHUB_OWNER: ${{ github.repository_owner }}
          LUMINA_GITHUB_REPO: ${{ github.event.repository.name }}
        run: pnpm desktop:dist:win:ci

      - name: Upload Windows assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cd apps/lumina-desktop/release
          for f in *; do
            [ -f "$f" ] && gh release upload "${{ github.ref_name }}" "$f" --clobber
          done

  # ── 3 of 5 ────────────────────────────────────────────────────────────────────
  build-macos:
    name: "3/5 build-macos"
    if: ${{ github.event.inputs.release_only != 'true' }}
    needs: build-windows
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust/lumina-bootstrapper -> target
            apps/lumina-desktop/src-tauri -> target
          shared-key: "lumina-rust-macos"
          cache-on-failure: false
          save-if: "false"

      - name: Download Lumina Code VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: lumina-code-vsix
          path: lumina-code-vsix

      - name: Export Lumina Code VSIX path
        shell: pwsh
        run: |
          $vsix = Get-ChildItem -LiteralPath lumina-code-vsix -Filter '*.vsix' | Sort-Object Name | Select-Object -Last 1
          if (-not $vsix) { throw 'Lumina Code VSIX artifact is missing.' }
          "LUMINA_CODE_VSIX_PATH=$($vsix.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: "Pre-flight: source layout"
        run: node --experimental-strip-types scripts/preflight-check.ts --mode=source

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Download OpenClaw from release
        id: dl-openclaw-mac
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.ref_name }}" \
            --pattern "openclaw-build.tar.gz"
          tar -xzf openclaw-build.tar.gz
          rm openclaw-build.tar.gz

      - name: Build OpenClaw locally (fallback)
        if: steps.dl-openclaw-mac.outcome == 'failure' || steps.dl-openclaw-mac.outcome == 'skipped'
        run: |
          cd Open_PC
          pnpm install --frozen-lockfile
          pnpm build:docker
          pnpm ui:build

      - name: "Pre-flight: bundle inputs"
        run: node --experimental-strip-types scripts/preflight-check.ts --mode=bundle-inputs

      - name: Build Rust bootstrapper
        run: pnpm desktop:bootstrapper:build

      - name: Build desktop (macOS)
        env:
          LUMINA_GITHUB_OWNER: ${{ github.repository_owner }}
          LUMINA_GITHUB_REPO: ${{ github.event.repository.name }}
        run: pnpm desktop:dist:mac:ci

      - name: Upload macOS assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cd apps/lumina-desktop/release
          for f in *; do
            [ -f "$f" ] && gh release upload "${{ github.ref_name }}" "$f" --clobber
          done

  # ── 4 of 5 ────────────────────────────────────────────────────────────────────
  build-linux:
    name: "4/5 build-linux"
    if: ${{ github.event.inputs.release_only != 'true' }}
    needs: build-macos
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Linux system dependencies (Tauri 2.x)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libarchive-tools \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libglib2.0-dev \
            unzip

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust/lumina-bootstrapper -> target
            apps/lumina-desktop/src-tauri -> target
          shared-key: "lumina-rust-linux"
          cache-on-failure: false
          save-if: "false"

      - name: Download Lumina Code VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: lumina-code-vsix
          path: lumina-code-vsix

      - name: Export Lumina Code VSIX path
        shell: pwsh
        run: |
          $vsix = Get-ChildItem -LiteralPath lumina-code-vsix -Filter '*.vsix' | Sort-Object Name | Select-Object -Last 1
          if (-not $vsix) { throw 'Lumina Code VSIX artifact is missing.' }
          "LUMINA_CODE_VSIX_PATH=$($vsix.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: "Pre-flight: source layout"
        run: node --experimental-strip-types scripts/preflight-check.ts --mode=source

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Download OpenClaw from release
        id: dl-openclaw-linux
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.ref_name }}" \
            --pattern "openclaw-build.tar.gz"
          tar -xzf openclaw-build.tar.gz
          rm openclaw-build.tar.gz

      - name: Build OpenClaw locally (fallback)
        if: steps.dl-openclaw-linux.outcome == 'failure' || steps.dl-openclaw-linux.outcome == 'skipped'
        run: |
          cd Open_PC
          pnpm install --frozen-lockfile
          pnpm build:docker
          pnpm ui:build

      - name: "Pre-flight: bundle inputs"
        run: node --experimental-strip-types scripts/preflight-check.ts --mode=bundle-inputs

      - name: Build Rust bootstrapper
        run: pnpm desktop:bootstrapper:build

      - name: Build desktop (Linux)
        env:
          LUMINA_GITHUB_OWNER: ${{ github.repository_owner }}
          LUMINA_GITHUB_REPO: ${{ github.event.repository.name }}
        run: pnpm desktop:dist:linux:ci

      - name: "Post-build: disk space"
        run: df -h

      - name: Upload Linux assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cd apps/lumina-desktop/release
          for f in *; do
            [ -f "$f" ] && gh release upload "${{ github.ref_name }}" "$f" --clobber
          done

  # ── 5 of 5 ────────────────────────────────────────────────────────────────────
  publish-release:
    name: "5/5 publish-release"
    if: |
      startsWith(github.ref, 'refs/tags/') ||
      github.event.inputs.release_only == 'true'
    needs: build-linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download release assets for notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-artifacts/lumina-desktop-all
          gh release download "${{ github.ref_name }}" \
            --dir release-artifacts/lumina-desktop-all

      - name: List release assets
        run: find release-artifacts -type f | sort

      # Remove the internal openclaw build asset — users don't need it.
      - name: Remove openclaw-build.tar.gz from release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete-asset "${{ github.ref_name }}" openclaw-build.tar.gz --yes || true

      - name: Render release notes
        run: |
          node --experimental-strip-types scripts/render-github-release-notes.ts \
            --artifacts-root release-artifacts \
            --output github-release-notes.md

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" \
            --draft=false \
            --notes-file github-release-notes.md

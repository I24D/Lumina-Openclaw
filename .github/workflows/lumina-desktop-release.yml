name: lumina-desktop-release

on:
  workflow_dispatch:
    inputs:
      release_only:
        description: "Re-run only the release step (skip re-building). Requires artifacts from a previous run."
        type: boolean
        default: false
      platform:
        description: "Build only one platform (leave blank = all). Options: windows | macos | linux"
        type: string
        default: ""
  push:
    tags:
      - "lumina-desktop-v*"

permissions:
  contents: write

# ── Global env shared across all jobs ─────────────────────────────────────────
env:
  NODE_VERSION: "24.13.1"
  PNPM_VERSION: "10.33.0"
  LUMINA_AUTH_URL: "https://lumina-auth.onrender.com"
  LUMINA_I24D_BASE_URL: "https://i24d-whatsapp-ai.onrender.com"
  LUMINA_I24D_CHAT_URL: "https://i24d-whatsapp-ai.onrender.com/v1/chat/completions"
  LUMINA_PROVIDER_ID: "lumina"
  LUMINA_MODEL_ID: "I24D"
  LUMINA_MODEL_NAME: "Lumina IA"
  LUMINA_MODEL_CONTEXT_WINDOW: "16000"
  LUMINA_MODEL_MAX_TOKENS: "4096"
  LUMINA_DEFAULT_TAB: "instances"
  LUMINA_REQUIRE_AUTH: "false"
  LUMINA_EMBED_RUNTIME_SECRETS: "false"
  LUMINA_REMOTE_BRAIN_ENABLED: "false"
  # OpenClaw is built in the dedicated build-openclaw job; tell prepare-desktop-bundle.ts to skip it
  LUMINA_SKIP_OPENCLAW_BUILD: "1"
  LUMINA_SKIP_OPENCLAW_UI_BUILD: "1"
  # Required: tells build.rs to embed runtime resources into the Tauri bundle
  LUMINA_TAURI_EMBED_RESOURCES: "1"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  # Fast gzip (level 1) — speeds up tar.gz archiving of the runtime bundle
  GZIP: "-1"
  # Incremental Rust compilation — cuts 40–70% off Rust build time after first run
  CARGO_INCREMENTAL: "1"
  # Keep Cargo output clean in CI
  CARGO_TERM_COLOR: "always"

# ── Job 1: Build OpenClaw once on Linux, share artifact with all platform jobs ─
# OpenClaw output (dist/, openclaw.mjs, assets/) is pure JS/CSS — platform-agnostic.
# Building it 3× (one per platform) wasted 5–10 min per platform run.
# Now: 1 build on ubuntu → artifact → 3 platform jobs download it.
jobs:
  build-openclaw:
    name: build-openclaw
    if: ${{ github.event.inputs.release_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Cache Open_PC node_modules keyed on its own lockfile.
      # Lives only in this job — platform jobs no longer need to install Open_PC deps.
      - name: Cache OpenClaw node_modules
        uses: actions/cache@v4
        with:
          path: Open_PC/node_modules
          key: openclaw-node-Linux-${{ hashFiles('Open_PC/pnpm-lock.yaml', 'Open_PC/package.json') }}
          restore-keys: |
            openclaw-node-Linux-

      - name: Install Open_PC dependencies
        working-directory: Open_PC
        run: pnpm install --no-frozen-lockfile

      - name: "Pre-flight: check disk space"
        run: |
          echo "=== Disk space before OpenClaw build ==="
          df -h
          AVAIL_KB=$(df --output=avail / | tail -1 | tr -d ' ')
          REQUIRED_KB=5242880   # 5 GB minimum
          if [ "$AVAIL_KB" -lt "$REQUIRED_KB" ]; then
            echo "::error::Insufficient disk space: ${AVAIL_KB}KB available, ${REQUIRED_KB}KB required."
            exit 1
          fi
          echo "Disk OK: ${AVAIL_KB}KB available."

      - name: Build OpenClaw runtime
        working-directory: Open_PC
        run: pnpm build:docker

      - name: Build OpenClaw UI
        working-directory: Open_PC
        run: pnpm ui:build

      # Upload built output as a shared artifact.
      # Platform jobs download this instead of re-running the build.
      # retention-days: 1 — only needs to survive until the 3 platform jobs complete.
      - name: Upload OpenClaw build output
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-build
          path: |
            Open_PC/dist
            Open_PC/openclaw.mjs
            Open_PC/assets
            Open_PC/skills
          if-no-files-found: error
          retention-days: 1

  # ── Job 2: Platform builds — depend on the shared OpenClaw artifact ───────────
  build:
    name: build-${{ matrix.name }}
    if: ${{ github.event.inputs.release_only != 'true' }}
    needs: build-openclaw
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 90
    strategy:
      fail-fast: false   # ← a macOS failure does NOT cancel Linux/Windows
      matrix:
        include:
          - name: windows
            runs_on: windows-latest
            script: desktop:dist:win:ci
            artifact_glob: apps/lumina-desktop/release/*
          - name: macos
            runs_on: macos-latest
            script: desktop:dist:mac:ci
            artifact_glob: apps/lumina-desktop/release/*
          - name: linux
            runs_on: ubuntu-latest
            script: desktop:dist:linux:ci
            artifact_glob: apps/lumina-desktop/release/*

    steps:
      # ── 1. Source ─────────────────────────────────────────────────────────────
      - name: Check out repository
        uses: actions/checkout@v4

      # ── 2. Toolchain setup ────────────────────────────────────────────────────
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm   # caches the workspace pnpm store keyed on pnpm-lock.yaml

      - name: Install Linux system dependencies (Tauri 2.x)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libarchive-tools \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libglib2.0-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # ── 3. Aggressive Rust caching ────────────────────────────────────────────
      # Caches ~/.cargo/registry, ~/.cargo/git, and compiled target/ dirs.
      # shared-key ensures the same cache is reused across tags of the same branch.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust/lumina-bootstrapper -> target
            apps/lumina-desktop/src-tauri -> target
          shared-key: "lumina-rust-${{ runner.os }}"
          cache-on-failure: true   # persist cache even on failed builds

      # ── 4. Pre-flight validation (FAST — runs before any compilation) ─────────
      - name: "Pre-flight: validate source layout"
        run: node --experimental-strip-types scripts/preflight-check.ts --mode=source

      # ── 5. Install workspace dependencies ─────────────────────────────────────
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # ── 6. Restore pre-built OpenClaw artifact (built once in build-openclaw) ──
      # No need to run pnpm build:docker or ui:build here — the output is already
      # compiled and platform-agnostic. Saves 5–10 min per platform job.
      #
      # IMPORTANT: path must be "." (workspace root), NOT "Open_PC".
      # The artifact was uploaded with paths like "Open_PC/dist/...", so extracting
      # to "." restores them to "Open_PC/dist/...". Extracting to "Open_PC" would
      # produce "Open_PC/Open_PC/dist/..." which breaks prepare-desktop-bundle.ts.
      - name: Download OpenClaw build output
        uses: actions/download-artifact@v4
        with:
          name: openclaw-build
          path: .

      # ── 7. Pre-flight: validate bundle inputs BEFORE Tauri compiles ──────────
      # Fails fast if openclaw-package, ui, or proxy are missing.
      - name: "Pre-flight: validate bundle inputs"
        run: node --experimental-strip-types scripts/preflight-check.ts --mode=bundle-inputs

      # ── 8. Build Rust bootstrapper ────────────────────────────────────────────
      - name: Build Rust bootstrapper
        run: pnpm desktop:bootstrapper:build

      # ── 9. Build Desktop (Tauri) + stage release artifacts ───────────────────
      - name: Build desktop package
        env:
          LUMINA_GITHUB_OWNER: ${{ github.repository_owner }}
          LUMINA_GITHUB_REPO: ${{ github.event.repository.name }}
        run: pnpm ${{ matrix.script }}

      # ── 10. Post-build disk check (Linux only) ────────────────────────────────
      - name: "Post-build: disk space after archiving (Linux)"
        if: runner.os == 'Linux'
        run: df -h

      # ── 11. Upload platform artifacts ─────────────────────────────────────────
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumina-desktop-${{ matrix.name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          # 7 days: keeps artifacts available for release-only reruns
          retention-days: 7

  # ── Job 3: Release — runs only when at least one build succeeded ──────────────
  # On tag push: waits for all 3 platform builds.
  # On workflow_dispatch with release_only=true: downloads artifacts from a previous run.
  release:
    name: publish-release
    if: |
      startsWith(github.ref, 'refs/tags/') ||
      github.event.inputs.release_only == 'true'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Download artifacts from the current run (or fail if they are missing).
      # When release_only=true this pulls the most recently uploaded artifacts.
      - name: Download workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: lumina-desktop-*
          merge-multiple: false

      - name: List downloaded artifacts
        run: find release-artifacts -type f | sort

      - name: Render GitHub release notes
        run: node --experimental-strip-types scripts/render-github-release-notes.ts --artifacts-root release-artifacts --output github-release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          body_path: github-release-notes.md

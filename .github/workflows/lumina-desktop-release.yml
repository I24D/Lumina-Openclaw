name: lumina-desktop-release

on:
  workflow_dispatch:
    inputs:
      build_openclaw_only:
        description: "STEP 1 — Build OpenClaw only. Run this first, fix any errors, then use the run ID for step 2."
        type: boolean
        default: false
      openclaw_run_id:
        description: "STEP 2 — Run ID from a successful 'build_openclaw_only' run (skip OpenClaw rebuild)."
        type: string
        default: ""
      release_only:
        description: "Re-run only the release step. Downloads assets already on the release."
        type: boolean
        default: false
      platform:
        description: "Build only one platform (leave blank = all). Options: windows | macos | linux"
        type: string
        default: ""
  push:
    tags:
      - "lumina-desktop-v*"

permissions:
  contents: write

# ── Global env shared across all jobs ─────────────────────────────────────────
env:
  NODE_VERSION: "24.13.1"
  PNPM_VERSION: "10.33.0"
  LUMINA_AUTH_URL: "https://lumina-auth.onrender.com"
  LUMINA_I24D_BASE_URL: "https://i24d-whatsapp-ai.onrender.com"
  LUMINA_I24D_CHAT_URL: "https://i24d-whatsapp-ai.onrender.com/v1/chat/completions"
  LUMINA_PROVIDER_ID: "lumina"
  LUMINA_MODEL_ID: "I24D"
  LUMINA_MODEL_NAME: "Lumina IA"
  LUMINA_MODEL_CONTEXT_WINDOW: "16000"
  LUMINA_MODEL_MAX_TOKENS: "4096"
  LUMINA_DEFAULT_TAB: "instances"
  LUMINA_REQUIRE_AUTH: "false"
  LUMINA_EMBED_RUNTIME_SECRETS: "false"
  LUMINA_REMOTE_BRAIN_ENABLED: "false"
  LUMINA_SKIP_OPENCLAW_BUILD: "1"
  LUMINA_SKIP_OPENCLAW_UI_BUILD: "1"
  LUMINA_TAURI_EMBED_RESOURCES: "1"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  GZIP: "-1"
  CARGO_INCREMENTAL: "1"
  CARGO_TERM_COLOR: "always"

jobs:
  # ── Job 1: Build OpenClaw + create draft release ───────────────────────────────
  # Skipped when openclaw_run_id is provided (reuse artifact from a prior run).
  # Set build_openclaw_only=true to run ONLY this job, verify it works, then
  # pass its run ID to the next dispatch as openclaw_run_id.
  build-openclaw:
    name: build-openclaw
    if: |
      github.event.inputs.release_only != 'true' &&
      github.event.inputs.openclaw_run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Open_PC dependencies
        working-directory: Open_PC
        run: pnpm install --no-frozen-lockfile

      - name: "Pre-flight: check disk space"
        run: |
          echo "=== Disk space before OpenClaw build ==="
          df -h
          AVAIL_KB=$(df --output=avail / | tail -1 | tr -d ' ')
          REQUIRED_KB=5242880
          if [ "$AVAIL_KB" -lt "$REQUIRED_KB" ]; then
            echo "::error::Insufficient disk space: ${AVAIL_KB}KB available."
            exit 1
          fi
          echo "Disk OK: ${AVAIL_KB}KB available."

      - name: Build OpenClaw runtime
        working-directory: Open_PC
        run: pnpm build:docker

      - name: Build OpenClaw UI
        working-directory: Open_PC
        run: pnpm ui:build

      # Only the OpenClaw artifact is stored in Actions storage (~50 MB, well within free quota).
      # Platform installers bypass artifact storage entirely — they upload directly to the Release.
      - name: Upload OpenClaw build output
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: openclaw-build
          path: |
            Open_PC/dist
            Open_PC/openclaw.mjs
            Open_PC/assets
            Open_PC/skills
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      # Create the draft release NOW so platform jobs can upload assets to it in parallel.
      # Skipped when build_openclaw_only=true — the user will trigger the full release separately.
      - name: Create draft GitHub release
        if: startsWith(github.ref, 'refs/tags/') && github.event.inputs.build_openclaw_only != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Lumina Desktop ${{ github.ref_name }}" \
            --draft \
            --notes "Assembling release assets…" || true

  # ── Job 2: Platform builds ─────────────────────────────────────────────────────
  # Each job compiles Tauri for its platform and uploads the installer directly to
  # the GitHub Release (draft). This avoids storing 3 × ~200 MB in Actions artifact
  # storage, which would exceed the 500 MB free-tier quota.
  #
  # Two trigger modes:
  #  A) Normal tag push — needs build-openclaw (which ran in this same workflow)
  #  B) workflow_dispatch with openclaw_run_id — skips build-openclaw entirely,
  #     downloads the OpenClaw artifact from the specified prior run ID
  build:
    name: build-${{ matrix.name }}
    if: |
      github.event.inputs.release_only != 'true' &&
      github.event.inputs.build_openclaw_only != 'true' &&
      (needs.build-openclaw.result == 'success' || needs.build-openclaw.result == 'skipped')
    needs: build-openclaw
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            runs_on: windows-latest
            script: desktop:dist:win:ci
          - name: macos
            runs_on: macos-latest
            script: desktop:dist:mac:ci
          - name: linux
            runs_on: ubuntu-latest
            script: desktop:dist:linux:ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Linux system dependencies (Tauri 2.x)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libarchive-tools \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libglib2.0-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Rust cache disabled (save-if: false) to prevent the ~500 MB/platform Rust
      # cache from consuming the Actions cache quota on every tag build.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust/lumina-bootstrapper -> target
            apps/lumina-desktop/src-tauri -> target
          shared-key: "lumina-rust-${{ runner.os }}"
          cache-on-failure: false
          save-if: "false"

      - name: "Pre-flight: validate source layout"
        run: node --experimental-strip-types scripts/preflight-check.ts --mode=source

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # If openclaw_run_id is provided, download from that prior run (skips rebuild).
      # Otherwise download from the current run (built by build-openclaw above).
      - name: Download OpenClaw build output
        id: download-openclaw
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: openclaw-build
          path: .
          run-id: ${{ github.event.inputs.openclaw_run_id || github.run_id }}

      - name: Build OpenClaw locally (artifact fallback)
        if: steps.download-openclaw.outcome == 'failure'
        run: |
          cd Open_PC
          pnpm install --no-frozen-lockfile
          pnpm build:docker
          pnpm ui:build

      - name: "Pre-flight: validate bundle inputs"
        run: node --experimental-strip-types scripts/preflight-check.ts --mode=bundle-inputs

      - name: Build Rust bootstrapper
        run: pnpm desktop:bootstrapper:build

      - name: Build desktop package
        env:
          LUMINA_GITHUB_OWNER: ${{ github.repository_owner }}
          LUMINA_GITHUB_REPO: ${{ github.event.repository.name }}
        run: pnpm ${{ matrix.script }}

      - name: "Post-build: disk space (Linux)"
        if: runner.os == 'Linux'
        run: df -h

      # Upload directly to the GitHub Release — no Actions artifact storage used.
      # Release assets are stored separately and do not count against the 500 MB quota.
      - name: Upload release assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cd apps/lumina-desktop/release
          for f in *; do
            if [ -f "$f" ]; then
              echo "Uploading: $f"
              gh release upload "${{ github.ref_name }}" "$f" --clobber
            fi
          done

  # ── Job 3: Finalize release ─────────────────────────────────────────────────────
  # Downloads all assets already uploaded to the draft release, generates release
  # notes, then publishes the release. No artifact storage used.
  release:
    name: publish-release
    if: |
      (startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_only == 'true') &&
      github.event.inputs.build_openclaw_only != 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Download assets from the release itself (not from Actions artifacts).
      - name: Download release assets for release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-artifacts/lumina-desktop-all
          gh release download "${{ github.ref_name }}" \
            --dir release-artifacts/lumina-desktop-all

      - name: List downloaded assets
        run: find release-artifacts -type f | sort

      - name: Render GitHub release notes
        run: |
          node --experimental-strip-types scripts/render-github-release-notes.ts \
            --artifacts-root release-artifacts \
            --output github-release-notes.md

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" \
            --draft=false \
            --notes-file github-release-notes.md

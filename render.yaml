services:
  - type: web
    name: lumina-auth
    env: node
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile=false --filter @lumina/auth... && pnpm --filter @lumina/auth build
    startCommand: pnpm --filter @lumina/auth start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3200"
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false

  - type: web
    name: lumina-brain
    env: node
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile=false --filter @lumina/brain... && pnpm --filter @lumina/protocol build && pnpm --filter @lumina/brain build
    startCommand: pnpm --filter @lumina/brain start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BRAIN_API_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: LUMINA_CORE_URL
        sync: false
      - key: LUMINA_BRAIN_SECRET
        sync: false
      - key: SESSION_TTL_MS
        value: "1800000"
      - key: MAX_TOOL_ITERATIONS
        value: "5"

services:
  - type: web
    name: lumina-auth
    env: node
    rootDir: apps/lumina-auth
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3200"
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false

  - type: web
    name: lumina-brain
    env: node
    rootDir: apps/lumina-brain
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BRAIN_API_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: LUMINA_CORE_URL
        sync: false
      - key: LUMINA_BRAIN_SECRET
        sync: false
      - key: SESSION_TTL_MS
        value: "1800000"
      - key: MAX_TOOL_ITERATIONS
        value: "5"

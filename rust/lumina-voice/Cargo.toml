[package]
name = "lumina-voice"
version = "1.0.14"
edition = "2021"
license = "MIT"
description = "Lumina voice sidecar: WinRT STT/TTS + UIA + audio + intent router"

[[bin]]
name = "lumina-voice"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
crossbeam-channel = "0.5"
regex = "1"
once_cell = "1"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }

[dependencies.windows]
version = "0.58"
features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Media_SpeechRecognition",
    "Media_SpeechSynthesis",
    "Media_Playback",
    "Media_Core",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
